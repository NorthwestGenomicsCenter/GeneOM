import org.apache.tools.ant.taskdefs.condition.Os
import cz.habarta.typescript.generator.gradle.GenerateTask

plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.hibernate.orm' version '6.5.3.Final'
	id 'org.graalvm.buildtools.native' version '0.10.3'
	id 'cz.habarta.typescript-generator' version '3.2.1263'
}

group = 'org.uw.nwgc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		url 'https://plugins.gradle.org/m2/'
	}
}

ext {
	jacksonVersion = '2.18.1'
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.4'
//	implementation 'org.flywaydb:flyway-core'
//	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
//	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.12.6'

	// Additions
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jdk8', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-hibernate5', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.module', name: 'jackson-module-parameter-names', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-xml', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-csv', version: jacksonVersion
	implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-yaml', version: jacksonVersion

}

hibernate {
	enhancement {
		enableAssociationManagement = true
	}
}

/***
 * osAdaptiveCommand helper function allows the same command to be run on
 * Windows and *nix based OSes without branching logic.
 */
private static Iterable<String> osAdaptiveCommand(String... commands) {
	def newCommands = []
	if (Os.isFamily(Os.FAMILY_WINDOWS)) {
		newCommands = ['cmd', '/c']
	}

	newCommands.addAll(commands)
	return newCommands
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named("build") {
	dependsOn("generateViewNamesTS")
}

task generateTypescript(type: GenerateTask, dependsOn: [compileJava]) {
	inputs.files('./src/**/*.java')
//	 outputs.files('../shared/generated/dto_interfaces.d.ts')

	jsonLibrary = 'jackson2'
	classPatterns = [
			'org.uw.nwgc.**.*DTO'
	]
	outputFileType = 'declarationFile'
	outputFile = '../frontend/types/DTOTypes.d.ts'
	outputKind = 'global'
}

bootRun {
	outputs.upToDateWhen { false }
	args = ["--spring.profiles.active=dev"]
	dependsOn("generateViewNamesTS")
}

tasks.register('admin', JavaExec) {
	outputs.upToDateWhen { false }
	args = ["--spring.profiles.active=dev"]
	mainClass = 'org.uw.nwgc.multiomics.UwMultiomicsBrowserApplication'
	classpath = sourceSets.main.runtimeClasspath
	systemProperty "spring.main.web-application-type", "NONE"
	standardInput = System.in
}

tasks.register('generateViewNamesTS', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set("org.uw.nwgc.multiomics.api.GenerateTSFromEnum")
	args = [
			"org.uw.nwgc.multiomics.api.ViewName",
			"${layout.projectDirectory}/../shared/viewNames.ts",
			"VIEW_NAMES",
			"ViewName"
	]
}
