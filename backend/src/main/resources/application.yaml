spring:
  application:
    name: UW Multiomics Browser
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  #  flyway:
#    locations: classpath:/db/migration
#    schemas: employees
#    baselineOnMigrate: true
#    enabled: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/multiomics?currentSchema=app
    username: multiomic
    password: 1234567
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
  mvc:
    servlet:
      path: /api
server:
  port: 8081
  servlet:
    application-display-name: UW Multiomics Browser API