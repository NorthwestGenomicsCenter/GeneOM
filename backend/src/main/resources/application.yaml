my:
  app-base-url: https://burnet.gs.washington.edu/multiomics
spring:
  application:
    name: UW Multiomics Browser
  config:
    import: optional:file:/data/apache-tomcat/instance/multiomics-api/webapps/.multiomics.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  #  flyway:
#    locations: classpath:/db/migration
#    schemas: employees
#    baselineOnMigrate: true
#    enabled: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/multiomics?currentSchema=app
    username: multiomic
    password: 1234567
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
        dialect: org.uw.nwgc.multiomics.configuration.CustomPostgresSQLDialect
        show_sql: false
  mvc:
    servlet:
      path: /api
  main:
    allow-bean-definition-overriding: true
server:
  error:
    whitelabel:
      enabled: false
  port: 8081
  servlet:
    application-display-name: UW Multiomics Browser API