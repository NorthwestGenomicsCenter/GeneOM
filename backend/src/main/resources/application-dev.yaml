my:
  app-base-url: http://localhost:3000
logging:
  level:
    root: INFO
    org:
      springframework:
        security: DEBUG
management:
  endpoints:
    web:
      exposure:
        include=*:
spring:
  config:
    import: optional:classpath:.env.local[.properties]
  mvc:
    servlet:
      path: /
server:
  port: 3005
  servlet:
    context-path: /multiomics/api/