name: Build and Publish Release Artifacts

on:
  release:
    types: [created]

jobs:
  generate-typescript:
    name: Generate shared TypeScript DTOs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Generate TypeScript DTOs
        run: ./gradlew generateTypescript

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-types
          path: shared/**

  build-backend:
    needs: generate-typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build WAR file
        run: ./gradlew war

      - name: Upload WAR to release
        uses: softprops/action-gh-release@v1
        with:
          files: backend/build/libs/*.war
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    needs: generate-typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download shared types
        uses: actions/download-artifact@v4
        with:
          name: shared-types
          path: ../shared

      - name: Set up Node.js 22.11.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Zip frontend .output directory
        run: |
          zip -r frontend.zip .output/

      - name: Upload zip to release
        uses: softprops/action-gh-release@v1
        with:
          files: '**/frontend.zip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
